{% extends '_layout.html' %}

{% block content %}
    {% for entry in view(entry_type_not=('links','sidebar','spec')).entries %}
        <article>
            <h2>{{ entry.title }}</h2>
            {{ entry.body }}

            {% if entry.more %}
                <nav class="more"><a href="{{ entry.link }}">Read more...</a></nav>
            {% endif %}
        </article>
    {% endfor %}
{% endblock %}
